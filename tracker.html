<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediaPipe Web Tracker</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1e1e1e; color: white; padding: 20px; }
        canvas { border: 2px solid #00ffcc; max-width: 100%; margin-top: 20px; border-radius: 8px; }
        video { display: none; } /* Hide the raw video, only show the drawn canvas */
        .upload-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00ffcc; color: black; border: none; border-radius: 5px; font-weight: bold;}
    </style>
</head>
<body>
    <h2>JavaScript MediaPipe Pose Tracker</h2>
    <p id="status" style="color: #ffaa00;">Loading AI Model... Please wait.</p>
    
    <!-- Upload Button -->
    <input type="file" id="videoUpload" class="upload-btn" accept="video/mp4,video/x-m4v,video/*" disabled>
    
    <!-- Hidden video player -->
    <video id="video" muted playsinline></video>
    
    <!-- Canvas where the stick figure is drawn -->
    <canvas id="outputCanvas"></canvas>

    <!-- Import modern MediaPipe Tasks Vision API -->
    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

        const video = document.getElementById("video");
        const canvas = document.getElementById("outputCanvas");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status");
        const videoUpload = document.getElementById("videoUpload");

        let poseLandmarker = null;
        let drawingUtils = new DrawingUtils(ctx);
        let isProcessing = false;
        let lastVideoTime = -1;

        // 1. Download and Initialize the Model
        async function loadModel() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                    delegate: "GPU" // Forces the browser to use hardware acceleration
                },
                runningMode: "VIDEO",
                numPoses: 1
            });
            status.innerText = "Model Loaded! Upload your .mp4 video.";
            status.style.color = "#00ffcc";
            videoUpload.disabled = false; // Enable the upload button
        }
        loadModel();

        // 2. Handle the User's Video Upload
        videoUpload.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            const fileURL = URL.createObjectURL(file);
            video.src = fileURL;
            status.innerText = `Processing '${file.name}'...`;
            status.style.color = "white";
        });

        // 3. Start processing once the video loads
        video.addEventListener("loadeddata", () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            video.play();
            isProcessing = true;
            predictFrame();
        });

        // 4. Frame-by-Frame Tracking Loop
        async function predictFrame() {
            if (!isProcessing) return;

            // Only analyze the frame if the video time has advanced
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                // Track the joints
                const results = await poseLandmarker.detectForVideo(video, performance.now());
                
                // Draw the original video frame onto the canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Draw the stick figure overlay
                if (results.landmarks) {
                    for (const landmark of results.landmarks) {
                        drawingUtils.drawConnectors(landmark, PoseLandmarker.POSE_CONNECTIONS, { color: "#FFFFFF", lineWidth: 4 });
                        drawingUtils.drawLandmarks(landmark, { color: "#FF0000", lineWidth: 2, radius: 4 });
                    }
                }
            }

            // Loop until the video finishes
            if (!video.ended) {
                requestAnimationFrame(predictFrame);
            } else {
                status.innerText = "Playback Complete! You can upload another video.";
                status.style.color = "#00ffcc";
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
