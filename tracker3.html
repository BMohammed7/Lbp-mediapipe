<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediaPipe Web Tracker & CSV Exporter</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1e1e1e; color: white; padding: 20px; }
        canvas { border: 2px solid #00ffcc; max-width: 100%; margin-top: 20px; border-radius: 8px; }
        video { display: none; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00ffcc; color: black; border: none; border-radius: 5px; font-weight: bold; text-decoration: none; margin: 5px; }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        #downloadBtn { background: #ffaa00; display: none; }
        #downloadCsvBtn { background: #ff3366; display: none; color: white; } /* New Pink CSV Button */
    </style>
</head>
<body>
    <h2>JavaScript MediaPipe Pose Tracker & Data Exporter</h2>
    <p id="status" style="color: #ffaa00;">Loading AI Model... Please wait.</p>
    
    <div>
        <input type="file" id="videoUpload" class="btn" accept="video/mp4,video/x-m4v,video/*" disabled>
        <a id="downloadBtn" class="btn" download="tracked_lifting_output.webm">Download Video</a>
        <a id="downloadCsvBtn" class="btn" download="joint_coordinates.csv">Download CSV Data</a>
    </div>
    
    <video id="video" muted playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

        const video = document.getElementById("video");
        const canvas = document.getElementById("outputCanvas");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status");
        const videoUpload = document.getElementById("videoUpload");
        const downloadBtn = document.getElementById("downloadBtn");
        const downloadCsvBtn = document.getElementById("downloadCsvBtn");

        let poseLandmarker = null;
        let drawingUtils = new DrawingUtils(ctx);
        let isProcessing = false;
        let lastVideoTime = -1;

        let mediaRecorder;
        let recordedChunks = [];
        let csvData = [];
        let frameCount = 0;

        async function loadModel() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numPoses: 1
            });
            status.innerText = "Model Loaded! Upload your .mp4 video.";
            status.style.color = "#00ffcc";
            videoUpload.disabled = false;
        }
        loadModel();

        videoUpload.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            // Hide buttons and reset data for new uploads
            downloadBtn.style.display = "none";
            downloadCsvBtn.style.display = "none";
            recordedChunks = [];
            csvData = ["Frame,Joint_ID,X,Y,Z,Visibility"]; // Initialize CSV Header
            frameCount = 0;
            
            const fileURL = URL.createObjectURL(file);
            video.src = fileURL;
            status.innerText = `Processing '${file.name}'... Please let the video play to the end.`;
            status.style.color = "white";
        });

        video.addEventListener("loadeddata", () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            video.play();
            isProcessing = true;

            const stream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                // Prepare Video Download
                const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(videoBlob);
                downloadBtn.style.display = "inline-block";

                // Prepare CSV Download
                const csvBlob = new Blob([csvData.join("\n")], { type: 'text/csv' });
                downloadCsvBtn.href = URL.createObjectURL(csvBlob);
                downloadCsvBtn.style.display = "inline-block";

                status.innerText = "Processing Complete! Download your video and CSV data.";
                status.style.color = "#00ffcc";
            };

            mediaRecorder.start();
            predictFrame();
        });

        async function predictFrame() {
            if (!isProcessing) return;

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                const results = await poseLandmarker.detectForVideo(video, performance.now());
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // If a skeleton is detected, extract the coordinates
                if (results.landmarks && results.landmarks.length > 0) {
                    const pose = results.landmarks[0];
                    
                    // Loop through all 33 joints and push them to the CSV array
                    for (let i = 0; i < pose.length; i++) {
                        const lm = pose[i];
                        
                        // Fallback to 0 if the AI fails to output a value for any axis
                        const x = (lm.x || 0).toFixed(6);
                        const y = (lm.y || 0).toFixed(6);
                        const z = (lm.z || 0).toFixed(6);
                        const v = (lm.visibility || 0).toFixed(4);
                        
                        csvData.push(`${frameCount},${i},${x},${y},${z},${v}`);
                    }
                    frameCount++;

                    drawingUtils.drawConnectors(pose, PoseLandmarker.POSE_CONNECTIONS, { color: "#FFFFFF", lineWidth: 4 });
                    drawingUtils.drawLandmarks(pose, { color: "#FF0000", lineWidth: 2, radius: 4 });
                }
            }

            if (!video.ended) {
                requestAnimationFrame(predictFrame);
            } else {
                mediaRecorder.stop();
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
